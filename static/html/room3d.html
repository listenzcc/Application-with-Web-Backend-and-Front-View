<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>FDS 三维模拟</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, "Microsoft YaHei", Arial, sans-serif;
            background: #eef2f6;
        }

        #view {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 800px;
            z-index: 10;
        }

        #view canvas {
            display: block;
        }

        #hud {
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 8px;
            z-index: 500;
            background: rgba(255, 255, 255, .93);
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
            padding: 8px 10px;
            font-size: 12px;
            color: #222;
        }

        #statusLine {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        #hudRow {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #frameRange {
            flex: 1 1 200px;
            min-width: 140px;
        }

        #frameLabel {
            font-variant-numeric: tabular-nums;
            min-width: 150px;
            display: inline-block;
        }

        #runningSpan {
            color: #8d6e00;
        }

        .btn {
            border: 1px solid #bbb;
            background: #fafafa;
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn:hover {
            background: #f0f0f0;
        }

        .btn:disabled {
            opacity: .5;
            cursor: default;
        }

        .tag {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 3px;
            background: #eee;
            color: #333;
        }

        .tag.success {
            background: #e6f4ea;
            color: #1b5e20;
        }

        .tag.failed {
            background: #fdecea;
            color: #b71c1c;
        }

        .tag.pending {
            background: #fff8e1;
            color: #8d6e00;
        }

        #legendLine {
            margin-top: 6px;
            color: #555;
        }

        #hudRow2 {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed #e0e0e0;
            color: #333;
        }

        #hudRow2 input.num {
            width: 92px;
            border: 1px solid #bbb;
            border-radius: 4px;
            padding: 1px 4px;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }

        #hudRow2 input[type=range] {
            width: 90px;
        }

        #contourNote {
            color: #666;
        }

        .swatch {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            vertical-align: -1px;
            margin-right: 3px;
            margin-left: 8px;
        }

        #templateBox {
            display: none;
            max-height: 220px;
            overflow: auto;
            margin-top: 6px;
            background: #1e1e1e;
            color: #d8d8d8;
            border-radius: 4px;
            padding: 6px;
            white-space: pre;
            font-family: Consolas, monospace;
            font-size: 11px;
        }

        #hintBox {
            position: absolute;
            left: 8px;
            top: 8px;
            z-index: 500;
            background: rgba(255, 255, 255, .8);
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 5px 8px;
            font-size: 11px;
            color: #555;
            line-height: 1.6;
        }

        #devcPanel {
            display: none;
            position: absolute;
            right: 8px;
            top: 8px;
            z-index: 600;
            width: 560px;
            max-height: calc(100% - 16px);
            overflow: auto;
            background: rgba(255, 255, 255, .95);
            border: 1px solid #cfd8dc;
            border-radius: 6px;
            padding: 8px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
        }

        #devcPanel .devc-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #37474f;
        }

        #devcPanel .devc-empty {
            font-size: 12px;
            color: #90a4ae;
            padding: 8px 2px;
        }

        #devcPanel canvas {
            display: block;
            width: 100%;
            margin-bottom: 6px;
        }
    </style>
</head>

<body>
    <div id="view"></div>

    <div id="hintBox">
        左键拖动旋转 · 滚轮缩放 · 右键拖动平移<br>
        体云由 PL3D 体数据三线性插值渲染
    </div>

    <div id="hud">
        <div id="statusLine">
            <span id="sessionTag" class="tag">会话</span>
            <span id="statusTag" class="tag">—</span>
            <span id="frameLabel">— / —</span>
            <span id="runningSpan"></span>
        </div>
        <div id="hudRow">
            <button id="playBtn" class="btn" title="播放 / 暂停" disabled>▶ 播放</button>
            <input id="frameRange" type="range" min="0" max="0" step="1" value="0" disabled>
            <select id="skipSelect" class="btn" title="拖动时间轴时每格跨多少模拟时间" disabled>
                <option value="5" selected>5 秒/格</option>
                <option value="10">10 秒/格</option>
                <option value="30">30 秒/格</option>
                <option value="60">60 秒/格</option>
            </select>
            <button id="devcBtn" class="btn" title="显示 FDS 里 DEVC 检测点的时间序列">检测点波形</button>
            <button id="templateBtn" class="btn" title="查看本次实际使用的输入卡">查看 CONTROL</button>
        </div>
        <div id="hudRow2">
            <label class="chk"><input id="dangerChk" type="checkbox" checked> 危险区着色</label>
            <span class="swatch" style="background:#f08c00"></span>
            <label>致伤 ≥ <input id="lvl1Input" class="num" type="number" step="any"><span class="unit"></span></label>
            <span class="swatch" style="background:#c1121f"></span>
            <label>致死 ≥ <input id="lvl2Input" class="num" type="number" step="any"><span class="unit"></span></label>
            <span id="contourNote">—</span>
        </div>
        <div id="hudRow2">
            <label>云浓度 <input id="opacityInput" type="range" min="0.1" max="3" step="0.05" value="1"></label>
            <label>采样步长 <input id="stepInput" type="range" min="0.5" max="2" step="0.1" value="1"></label>
            <label class="chk"><input id="obstChk" type="checkbox" checked> 障碍物</label>
            <label class="chk"><input id="devcChk" type="checkbox" checked> 检测点</label>
            <label class="chk"><input id="boxChk" type="checkbox" checked> 计算域边框</label>
            <label class="chk"><input id="darkChk" type="checkbox"> 深色背景</label>
        </div>
        <div id="legendLine">
            <span id="legendUnit">浓度</span>
            <span class="swatch" style="background:#FDE725"></span>高
            <span class="swatch" style="background:#22A884"></span>
            <span class="swatch" style="background:#440154"></span>低
            <span id="scaleText"></span>
        </div>
        <pre id="templateBox"></pre>
    </div>

    <div id="devcPanel">
        <div class="devc-head">
            <span>检测点波形（DEVC）</span>
            <button id="devcCloseBtn" class="btn">关闭</button>
        </div>
        <div id="devcCharts"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "/static/src/three/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from '/static/src/three/OrbitControls.js';

        const sessionStr = "{{session}}";
        const resultApiUrl = `/get_fds3d_simulation_result/${encodeURIComponent(sessionStr)}`;
        const frameApiUrl = (frame) => `/get_fds3d_simulation_frame?session=${encodeURIComponent(sessionStr)}&frame=${encodeURIComponent(frame)}`;
        const templateApiUrl = `/get_fds3d_simulation_template?session=${encodeURIComponent(sessionStr)}`;

        const $ = (id) => document.getElementById(id);

        const LIGHT_BG = 0xeef2f6;
        const DARK_BG = 0x0b0f14;

        // FDS 的 CO 体积分数在 PL3D / DEVC 里都是 mol/mol（量级 1e-6），
        // 显示时统一按 ppm（×1e6）才是「真实值」。
        //
        // 色标不再由前端猜：体数据的字节是按 frames.json 里的绝对色标压的
        // （默认 0 ~ 2000 ppm），接口会把换算好的 scale 一起给过来，字节解码
        // 出来直接就是 ppm。只有老会话缺这些字段时才退回下面的兜底值。
        const PPM_SCALE = 1e6;
        const FALLBACK_SCALE_MAX = 2000;
        // 危险区默认阈值（ppm）：0 ~ 2000 的色标里，致伤 420 / 致死 1700
        const DEFAULT_LVL1 = 420;
        const DEFAULT_LVL2 = 1700;

        // OBST 默认色：conf/fds3d_obst_color.yml 里没给这个 OBST 配色时的样子。
        // 配了色的 OBST 由接口在 environment.obst[i].color 里带过来（#rrggbb）。
        const OBST_FILL = 0x9aa7b1;
        const OBST_WIRE = 0x546e7a;
        // 面色不透明度：太低会被背景冲淡（看着像只有边框有色），0.75 兼顾显色与透视
        const OBST_OPACITY = 0.75;

        // 与二维页面共用的色标（viridis 五段）与危险区配色
        const VIRIDIS = [
            [0x44, 0x01, 0x54], [0x41, 0x44, 0x87], [0x2A, 0x78, 0x8E],
            [0x22, 0xA8, 0x84], [0xFD, 0xE7, 0x25],
        ];

        const state = {
            frames: [],
            index: 0,
            playing: false,
            timer: null,
            status: 'missing',
            vMin: 0,             // 色标下限（显示单位）
            vMax: 1,             // 色标上限（显示单位）
            displayUnits: '',    // 显示单位（体积分数是 ppm）
            dataMax: null,       // 数据真实峰值（显示单位），用来说明「已封顶」
            clamped: false,      // 是否有体素超出色标上限被截断
            grid: null,          // [nx, ny, nz]
            xb: null,            // [x0,x1,y0,y1,z0,z1]
            lvl1: null,
            lvl2: null,
            lvlInit: false,
            cache: new Map(),    // 帧号 -> Uint8Array
            texture: null,
            bytes: null,
            mesh: null,
            uniforms: null,
            baseStep: 0.1,       // 最小网格边长，采样步长的基准
            current: -1,
            devc: null,          // DEVC 时间序列 {names, units, times, values}
        };

        // ------------------------------------------------------------------
        // 场景
        // ------------------------------------------------------------------
        const container = $('view');
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setClearColor(LIGHT_BG, 1);
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        // 灯：OBST 用的是受光材质，场景里一盏灯都没有的话填充面会算成黑的
        // （只剩无光照的线框有色）。环境光打底 + 主光/补光给体块一点明暗层次。
        // 体渲染是自定义 shader、网格和 DEVC 点是无光照材质，都不受这里影响。
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.7);
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
        keyLight.position.set(1.0, -1.2, 1.8);
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.9);
        fillLight.position.set(-1.2, 1.0, 0.6);
        scene.add(ambientLight, keyLight, fillLight);

        // FDS 的 z 轴朝上，让相机也跟着用 z-up
        const camera = new THREE.PerspectiveCamera(
            45, container.clientWidth / container.clientHeight, 0.005, 5000);
        camera.up.set(0, 0, 1);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.12;

        const helpers = new THREE.Group();
        scene.add(helpers);

        // 辅助元素按类分组，显隐开关直接切组，别去猜 geometry 类型
        const gridGroup = new THREE.Group();
        const obstGroup = new THREE.Group();
        const devcGroup = new THREE.Group();
        helpers.add(gridGroup, obstGroup, devcGroup);

        const boxGroup = new THREE.Group();
        scene.add(boxGroup);

        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', onResize);

        // ------------------------------------------------------------------
        // 体渲染着色器
        // ------------------------------------------------------------------
        const vertexShader = /* glsl */`
            uniform vec3 uBoxSize;
            out vec3 vPos;          // 盒子局部坐标，0 ~ size

            void main() {
                vPos = position + uBoxSize * 0.5;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = /* glsl */`
            precision highp float;
            precision highp sampler3D;

            in vec3 vPos;
            out vec4 outColor;

            uniform sampler3D uVolume;
            uniform vec3 uBoxSize;
            uniform vec3 uCameraPos;   // 相机在盒子局部坐标（0 ~ size）里的位置
            uniform float uGlobalMin;  // 色标下限（ppm）
            uniform float uGlobalMax;  // 色标上限（ppm）
            uniform float uLvl1;       // 致伤阈值（ppm）
            uniform float uLvl2;       // 致死阈值（ppm）
            uniform float uUseDanger;
            uniform float uOpacity;
            uniform float uStep;

            vec3 viridis(float t) {
                t = clamp(t, 0.0, 1.0) * 4.0;
                vec3 c0 = vec3(0.267, 0.005, 0.329);
                vec3 c1 = vec3(0.255, 0.267, 0.529);
                vec3 c2 = vec3(0.165, 0.471, 0.557);
                vec3 c3 = vec3(0.133, 0.659, 0.518);
                vec3 c4 = vec3(0.992, 0.906, 0.145);
                if (t < 1.0) return mix(c0, c1, t);
                if (t < 2.0) return mix(c1, c2, t - 1.0);
                if (t < 3.0) return mix(c2, c3, t - 2.0);
                return mix(c3, c4, t - 3.0);
            }

            // 光线与 [0, uBoxSize] 盒子的交点参数
            vec2 hitBox(vec3 ro, vec3 rd) {
                vec3 invD = 1.0 / rd;
                vec3 t0 = (vec3(0.0) - ro) * invD;
                vec3 t1 = (uBoxSize - ro) * invD;
                vec3 tmin = min(t0, t1);
                vec3 tmax = max(t0, t1);
                return vec2(max(max(tmin.x, tmin.y), tmin.z),
                            min(min(tmax.x, tmax.y), tmax.z));
            }

            // 屏幕空间确定性抖动：同一个像素每帧拿到同一个偏移量。
            // 之前是逐帧取随机数去抖采样起点，本意是打散等距采样的条纹，
            // 但相位每帧都变，密区的累积不透明度就跟着逐帧抖，静态视角也
            // 在闪（步长越大越明显）。改成按像素固定的低差异偏移后，条纹
            // 照样被拆成高频噪点，而静态视角每帧结果完全一致。
            float hash12(vec2 p) {
                vec3 p3 = fract(vec3(p.xyx) * 0.1031);
                p3 += dot(p3, p3.yzx + 33.33);
                return fract((p3.x + p3.y) * p3.z);
            }

            void main() {
                vec3 ro = uCameraPos;
                vec3 rd = normalize(vPos - ro);
                vec2 t = hitBox(ro, rd);
                float tNear = max(t.x, 0.0);
                float tFar = t.y;
                if (tFar <= tNear) discard;

                float step = uStep;
                int steps = int(min(4096.0, (tFar - tNear) / step));
                float start = tNear + step * hash12(gl_FragCoord.xy);

                vec4 acc = vec4(0.0);
                for (int i = 0; i < 4096; i++) {
                    if (i >= steps) break;
                    vec3 p = ro + rd * (start + float(i) * step);
                    float g = texture(uVolume, p / uBoxSize).r;   // 色标归一化 0~1
                    if (g > 0.0015) {
                        float val = mix(uGlobalMin, uGlobalMax, g);
                        // 字节本来就是按色标线性压出来的，所以 g 就是「占色标
                        // 上限的比例」，直接当浓度权重用：跟色标一致，也不会
                        // 帧间抖。低次幂才能把烟羽主体提亮，高次幂只剩核心
                        float a = pow(g, 0.4) * uOpacity * 0.12;
                        vec3 col = viridis(g);
                        if (uUseDanger > 0.5) {
                            if (val >= uLvl2) {
                                col = mix(col, vec3(0.757, 0.071, 0.122), 0.8);
                                a = max(a, 0.10);
                            } else if (val >= uLvl1) {
                                col = mix(col, vec3(0.941, 0.549, 0.0), 0.65);
                                a = max(a, 0.055);
                            }
                        }
                        acc.rgb += (1.0 - acc.a) * a * col;
                        acc.a += (1.0 - acc.a) * a;
                        if (acc.a > 0.985) break;
                    }
                }

                if (acc.a <= 0.002) discard;
                // 标准 alpha 混合要非预乘颜色
                outColor = vec4(acc.rgb / max(acc.a, 1e-4), acc.a);
            }
        `;

        function makeVolumeMaterial() {
            return new THREE.ShaderMaterial({
                glslVersion: THREE.GLSL3,
                vertexShader,
                fragmentShader,
                transparent: true,
                depthWrite: false,
                side: THREE.BackSide,
                uniforms: {
                    uVolume: { value: null },
                    uBoxSize: { value: new THREE.Vector3(1, 1, 1) },
                    uCameraPos: { value: new THREE.Vector3() },
                    uGlobalMin: { value: 0 },
                    uGlobalMax: { value: 1 },
                    uLvl1: { value: 1e9 },
                    uLvl2: { value: 1e9 },
                    uUseDanger: { value: 1 },
                    uOpacity: { value: 1 },
                    uStep: { value: 0.1 },
                },
            });
        }

        // ------------------------------------------------------------------
        // 场景搭建（拿到 xb / ijk 之后才能建）
        // ------------------------------------------------------------------
        function buildScene() {
            const [x0, x1, y0, y1, z0, z1] = state.xb;
            const [nx, ny, nz] = state.grid;
            const sx = x1 - x0, sy = y1 - y0, sz = z1 - z0;
            const center = new THREE.Vector3((x0 + x1) / 2, (y0 + y1) / 2,
                                             (z0 + z1) / 2);

            const geometry = new THREE.BoxGeometry(sx, sy, sz);
            const material = makeVolumeMaterial();
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(center);
            mesh.frustumCulled = false;
            scene.add(mesh);
            state.mesh = mesh;
            state.uniforms = material.uniforms;

            // 体数据纹理：uint8 单通道，线性过滤（三线性插值）
            const tex = new THREE.Data3DTexture(
                new Uint8Array(nx * ny * nz), nx, ny, nz);
            tex.format = THREE.RedFormat;
            tex.type = THREE.UnsignedByteType;
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.wrapS = THREE.ClampToEdgeWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.wrapR = THREE.ClampToEdgeWrapping;
            tex.unpackAlignment = 1;
            tex.needsUpdate = true;
            state.texture = tex;
            material.uniforms.uVolume.value = tex;

            // 采样步长取最小网格边长，物理空间等距
            const cell = Math.min(sx / (nx - 1), sy / (ny - 1), sz / (nz - 1));
            state.baseStep = cell;
            material.uniforms.uStep.value = cell;
            material.uniforms.uBoxSize.value.set(sx, sy, sz);

            // 计算域边框
            const edges = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.BoxGeometry(sx, sy, sz)),
                new THREE.LineBasicMaterial({ color: 0x37474f }));
            edges.position.copy(center);
            boxGroup.add(edges);

            // 地面网格：GridHelper 默认躺在 y-up 的 XZ 平面里，
            // 我们是 z-up，转 90° 才是真正的地板
            const grid = new THREE.GridHelper(Math.max(sx, sy), 10, 0xb0bec5, 0xcfd8dc);
            grid.rotation.x = Math.PI / 2;
            grid.position.set(center.x, center.y, z0);
            gridGroup.add(grid);

            // 相机初始位置：斜上方看向域中心
            const dist = Math.max(sx, sy, sz) * 2.0;
            camera.position.set(center.x + dist * 0.9,
                                center.y - dist * 0.9,
                                center.z + dist * 0.65);
            controls.target.copy(center);
            controls.update();
        }

        function drawObstacles(env) {
            const obst = (env && env.obst) || [];
            obst.forEach((o) => {
                const [a, b, c, d, e, f] = o.xb;
                const geo = new THREE.BoxGeometry(b - a, d - c, f - e);
                // 颜色来自 conf/fds3d_obst_color.yml（按 OBST 名匹配）；没配就用默认色
                const base = new THREE.Color(o.color || OBST_FILL);
                // 用 Lambert（受光但有环境光打底），保证面色跟着配置走
                const mat = new THREE.MeshLambertMaterial({
                    color: base.clone(), transparent: true,
                    opacity: OBST_OPACITY,
                });
                const m = new THREE.Mesh(geo, mat);
                m.position.set((a + b) / 2, (c + d) / 2, (e + f) / 2);
                obstGroup.add(m);
                const wire = new THREE.LineSegments(
                    new THREE.EdgesGeometry(geo),
                    new THREE.LineBasicMaterial({
                        // 配了色的用同色加深作边框，没配就用默认灰蓝
                        color: o.color ? base.clone().multiplyScalar(0.55)
                                       : OBST_WIRE,
                    }));
                wire.position.copy(m.position);
                obstGroup.add(wire);
            });
        }

        function drawDevices(env) {
            const [x0, x1, y0, y1, z0, z1] = state.xb;
            const r = Math.max((x1 - x0), (y1 - y0)) * 0.012;
            const dot = (x, y, z, color) => {
                const m = new THREE.Mesh(
                    new THREE.SphereGeometry(r, 16, 12),
                    new THREE.MeshBasicMaterial({ color }));
                m.position.set(x, y, Math.min(Math.max(z, z0), z1));
                devcGroup.add(m);
            };
            // 只画 FDS 输入卡里写的 DEVC；三维已经不再跟传感器库联动
            ((env && env.devices) || []).forEach((d) => {
                if (!d.xyz) return;
                dot(d.xyz[0], d.xyz[1], d.xyz[2], 0x1565c0);
            });
        }

        function clearGroup(group) {
            while (group.children.length) {
                const c = group.children.pop();
                if (c.geometry) c.geometry.dispose();
                if (c.material) c.material.dispose();
            }
        }

        // ------------------------------------------------------------------
        // 数据
        // ------------------------------------------------------------------
        function setStatus(status, note) {
            state.status = status;
            const mapping = { success: '完成', failed: '失败', pending: '计算中', missing: '无数据' };
            const tag = $('statusTag');
            tag.textContent = mapping[status] || status;
            tag.className = 'tag ' + (status === 'pending' ? 'pending' : status);
            tag.title = note || '';
            $('sessionTag').textContent = sessionStr === '???' ? '未选择会话' : sessionStr;
        }

        function fmtNum(v) {
            const n = Number(v);
            if (!isFinite(n)) return '—';
            if (n === 0) return '0';
            if (Math.abs(n) < 1e-3 || Math.abs(n) >= 1e5) return n.toExponential(2);
            return String(Number(n.toPrecision(3)));
        }

        /** ppm 这种整数级别的量，千分位更好读（420 / 1,700 / 254,240）。 */
        function fmtPpm(v) {
            const n = Number(v);
            if (!isFinite(n)) return '—';
            if (Math.abs(n) >= 1000) {
                return Math.round(n).toFixed(0)
                    .replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }
            if (n === 0) return '0';
            return String(Number(n.toPrecision(3)));
        }

        /** 按当前显示单位挑格式。 */
        function fmtVal(v) {
            return state.displayUnits === 'ppm' ? fmtPpm(v) : fmtNum(v);
        }

        /**
         * 从接口结果里取出色标与显示单位。
         *
         * 新会话由 frames.json 给出 scale（绝对色标，字节就是按它压的）；
         * 老会话没有这个字段，就退回「v_min ~ v_max 即字节解码范围」，
         * 体积分数再乘 1e6 换成 ppm。
         */
        function readScale(resp) {
            const units = resp.units || (resp.volume || {}).units || '';
            const k = Number(resp.unit_scale)
                || (units === 'mol/mol' ? PPM_SCALE : 1);
            const sc = Array.isArray(resp.scale) ? resp.scale : null;
            let lo;
            let hi;
            if (sc && sc[0] !== null && sc[0] !== undefined
                && sc[1] !== null && sc[1] !== undefined) {
                lo = Number(sc[0]);
                hi = Number(sc[1]);
            } else {
                lo = (resp.v_min === null || resp.v_min === undefined)
                    ? 0 : Number(resp.v_min) * k;
                hi = (resp.v_max === null || resp.v_max === undefined)
                    ? FALLBACK_SCALE_MAX : Number(resp.v_max) * k;
            }
            if (!isFinite(lo)) lo = 0;
            if (!isFinite(hi) || hi <= lo) hi = lo + FALLBACK_SCALE_MAX;
            state.vMin = lo;
            state.vMax = hi;
            state.displayUnits = resp.display_units
                || (k === PPM_SCALE ? 'ppm' : units);

            const dr = Array.isArray(resp.data_range) ? resp.data_range : null;
            state.dataMax = (dr && dr[1] !== null && dr[1] !== undefined)
                ? Number(dr[1]) : null;
            state.clamped = !!resp.clamped;
        }

        function updateScaleText() {
            const u = state.displayUnits ? ' ' + state.displayUnits : '';
            let text = `　色标 ${fmtVal(state.vMin)} ~ ${fmtVal(state.vMax)}${u}`;
            if (state.clamped && state.dataMax !== null
                && state.dataMax > state.vMax) {
                text += `　（峰值 ${fmtVal(state.dataMax)}${u}，`
                    + '超出色标的部分按上限着色）';
            }
            $('scaleText').textContent = text;
            $('legendUnit').textContent =
                `浓度${state.displayUnits ? '（' + state.displayUnits + '）' : ''}`;
            document.querySelectorAll('#hud span.unit').forEach((el) => {
                el.textContent = state.displayUnits ? ' ' + state.displayUnits : '';
            });
        }

        function setFrameLabel() {
            const n = state.frames.length;
            if (!n) { $('frameLabel').textContent = '— / —'; return; }
            const f = state.frames[state.index];
            const t = (f.time === null || f.time === undefined) ? '—' : `${f.time}s`;
            $('frameLabel').textContent = `t = ${t}   (${state.index + 1}/${n})`;
            updateDevcMarker();
        }

        // ------------------------------------------------------------------
        // DEVC 波形面板：把 *_devc.csv 的读数画成时间序列
        // ------------------------------------------------------------------

        const DEVC_COLORS = [
            '#1565c0', '#c1121f', '#2e7d32', '#ef6c00', '#6a1b9a',
            '#00838f', '#8d6e63', '#c62828', '#455a64', '#ad1457',
        ];

        function currentFrameTime() {
            const f = state.frames[state.index];
            return (f && f.time !== null && f.time !== undefined)
                ? Number(f.time) : null;
        }

        function updateDevcMarker() {
            if (!state.devc) return;
            state.devc.markerTime = currentFrameTime();
            state.devc.groups.forEach(drawDevcChart);
        }

        function setupDevc(devc) {
            const box = $('devcCharts');
            box.innerHTML = '';
            const names = (devc && devc.names) || [];
            if (!names.length) {
                box.innerHTML = '<div class="devc-empty">这次模拟没有 DEVC 读数'
                    + '（输入卡里写 &DEVC，跑完就有波形）</div>';
                state.devc = null;
                return;
            }

            // 按单位分组：体积分数和速度不是一个量纲，得分开画
            const groups = new Map();
            names.forEach((name, i) => {
                const unit = (devc.units && devc.units[i]) || '';
                if (!groups.has(unit)) groups.set(unit, []);
                groups.get(unit).push(name);
            });

            state.devc = {
                names,
                units: devc.units || [],
                times: devc.times || [],
                values: devc.values || {},
                groups: [...groups.entries()].map(([unit, list]) => ({
                    unit, list,
                })),
                markerTime: currentFrameTime(),
            };
            state.devc.groups.forEach(drawDevcChart);
        }

        function drawDevcChart(group) {
            const { unit, list } = group;
            const times = state.devc.times;
            // 体积分数按 ppm 画，跟 HUD 和色标保持同一个单位
            const uScale = (unit === 'mol/mol') ? PPM_SCALE : 1;
            const uLabel = (unit === 'mol/mol') ? 'ppm' : (unit || '—');
            const W = 520;
            const H = 168;
            const pad = { l: 56, r: 10, t: 24, b: 22 };

            const canvas = document.createElement('canvas');
            canvas.width = W * 2;
            canvas.height = H * 2;
            canvas.style.height = H + 'px';
            canvas.dataset.unit = unit;
            const ctx = canvas.getContext('2d');
            ctx.scale(2, 2);

            // 数值范围
            let lo = Infinity, hi = -Infinity;
            const series = [];
            list.forEach((name) => {
                const v = (state.devc.values[name] || []).map(
                    (e) => Number(e) * uScale);
                series.push({ name, v });
                v.forEach((e) => {
                    if (isFinite(e)) {
                        lo = Math.min(lo, e);
                        hi = Math.max(hi, e);
                    }
                });
            });
            if (!isFinite(lo)) { lo = 0; hi = 1; }
            if (hi - lo < 1e-12) hi = lo + 1e-12;
            const span = hi - lo;
            lo -= span * 0.06;
            hi += span * 0.06;

            const tMax = Math.max(...times, 1e-9);
            const X = (t) => pad.l + (t / tMax) * (W - pad.l - pad.r);
            const Y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);

            // 背景与网格
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = '#eceff1';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = pad.t + i * (H - pad.t - pad.b) / 4;
                ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
            }

            // 标题：单位组
            ctx.fillStyle = '#37474f';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText(`${list.length} 条 · 单位 ${uLabel}`, pad.l, 13);

            // y 轴刻度
            ctx.font = '10px sans-serif';
            ctx.fillStyle = '#78909c';
            for (let i = 0; i <= 4; i++) {
                const v = hi - i * (hi - lo) / 4;
                const y = pad.t + i * (H - pad.t - pad.b) / 4;
                ctx.fillText(uScale !== 1 ? fmtPpm(v) : fmtNum(v), 4, y + 3);
            }
            // x 轴刻度
            for (let i = 0; i <= 4; i++) {
                const t = tMax * i / 4;
                ctx.fillText(t.toFixed(0) + 's', X(t) - 8, H - 6);
            }

            // 曲线
            series.forEach((s, i) => {
                ctx.strokeStyle = DEVC_COLORS[i % DEVC_COLORS.length];
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                s.v.forEach((v, k) => {
                    const t = times[k];
                    if (t === undefined || !isFinite(v)) return;
                    const x = X(t), y = Y(v);
                    k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.stroke();
            });

            // 当前帧时间竖线
            const mt = state.devc.markerTime;
            if (mt !== null && isFinite(mt) && mt >= 0 && mt <= tMax) {
                ctx.strokeStyle = '#ff8f00';
                ctx.lineWidth = 1.2;
                ctx.setLineDash([4, 3]);
                ctx.beginPath();
                ctx.moveTo(X(mt), pad.t);
                ctx.lineTo(X(mt), H - pad.b);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 图例
            ctx.font = '10px sans-serif';
            let lx = pad.l;
            series.forEach((s, i) => {
                ctx.fillStyle = DEVC_COLORS[i % DEVC_COLORS.length];
                ctx.fillRect(lx, H - 13, 8, 3);
                ctx.fillStyle = '#546e7a';
                ctx.fillText(s.name, lx + 11, H - 9);
                lx += 11 + ctx.measureText(s.name).width + 12;
            });

            const box = $('devcCharts');
            const old = box.querySelector(`canvas[data-unit="${CSS.escape(unit)}"]`);
            if (old) old.replaceWith(canvas);
            else box.appendChild(canvas);
        }

        $('devcBtn').addEventListener('click', () => {
            const p = $('devcPanel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        });
        $('devcCloseBtn').addEventListener('click', () => {
            $('devcPanel').style.display = 'none';
        });

        async function refresh() {
            let resp;
            try {
                const r = await fetch(resultApiUrl);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                resp = await r.json();
            } catch (e) {
                setStatus('failed', String(e));
                return;
            }

            setStatus(resp.status, resp.note);
            readScale(resp);
            updateScaleText();
            initLevels(resp);

            if (resp.status === 'pending') {
                $('runningSpan').textContent = resp.exists ? '模拟正在计算，请稍候…' : '尚未开始';
                setTimeout(refresh, 2000);
                return;
            }
            $('runningSpan').textContent = resp.note ? resp.note : '';
            if (resp.status !== 'success') return;

            const vol = resp.volume || {};
            state.grid = vol.ijk || null;
            state.xb = vol.xb || (resp.config || {}).xb || null;
            if (!state.grid || !state.xb) return;

            const frames = resp.frames || [];
            state.frames = frames;
            const range = $('frameRange');
            range.min = 0;
            range.max = Math.max(0, frames.length - 1);
            range.disabled = frames.length < 1;
            $('skipSelect').disabled = frames.length < 2;
            applySkipGear();
            $('playBtn').disabled = frames.length < 2;
            setFrameLabel();

            if (!state.mesh) {
                buildScene();
                drawObstacles(resp.environment);
                drawDevices(resp.environment);
                applyToggles();
                await showFrame(0);
            } else {
                await showFrame(state.index);
            }
            setupDevc(resp.devc);
        }

        async function frameBytes(frame) {
            const cached = state.cache.get(frame.index);
            if (cached) return cached;
            const r = await fetch(frameApiUrl(frame.file));
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const buf = await r.arrayBuffer();
            const bytes = new Uint8Array(buf);
            state.cache.set(frame.index, bytes);
            return bytes;
        }

        async function showFrame(index) {
            const frame = state.frames[index];
            if (!frame || !state.texture) return;
            let bytes;
            try {
                bytes = await frameBytes(frame);
            } catch (e) {
                console.warn('读取体数据失败', e);
                return;
            }
            const expected = state.grid[0] * state.grid[1] * state.grid[2];
            if (bytes.length !== expected) {
                console.warn(`体数据长度 ${bytes.length} 与网格 ${expected} 不符`);
            }
            state.texture.image.data.set(bytes);
            state.texture.needsUpdate = true;
            state.current = index;
            state.bytes = bytes;

            const u = state.uniforms;
            // 色标是整场固定的绝对范围，不随帧变；浓度权重直接用字节本身
            u.uGlobalMin.value = state.vMin;
            u.uGlobalMax.value = state.vMax;

            updateDangerNote();
            setFrameLabel();
        }

        function updateDangerNote() {
            const el = $('contourNote');
            if (!state.bytes) { el.textContent = '—'; return; }
            const showDanger = $('dangerChk').checked;
            if (!showDanger) { el.textContent = '（危险区着色已关闭）'; return; }

            const span = Math.max(state.vMax - state.vMin, 1e-12);
            const l1 = Number(state.lvl1);
            const l2 = Number(state.lvl2);
            let n1 = 0;
            let n2 = 0;
            const bytes = state.bytes;
            const stride = Math.max(1, Math.floor(bytes.length / 400000));
            let total = 0;
            for (let i = 0; i < bytes.length; i += stride) {
                const v = state.vMin + (bytes[i] / 255) * span;
                if (v >= l1) n1++;
                if (v >= l2) n2++;
                total++;
            }
            const p1 = total ? (n1 / total * 100).toFixed(2) : '0';
            const p2 = total ? (n2 / total * 100).toFixed(2) : '0';
            const u = state.displayUnits ? ' ' + state.displayUnits : '';
            el.textContent =
                `致伤 ≥ ${fmtVal(l1)}${u} 占 ${p1}% 体素　|　`
                + `致死 ≥ ${fmtVal(l2)}${u} 占 ${p2}% 体素`;
        }

        function initLevels(res) {
            if (state.lvlInit) return;
            const cfg = (res && res.config) || {};
            const lo = state.vMin;
            const hi = state.vMax;
            const span = Math.max(hi - lo, 1e-12);
            const pick = (v, fallback) => {
                // 没存过阈值时是 null，Number(null) 是 0，得先挡掉，
                // 不然阈值会被初始化成 0，整片数据都成了危险区
                if (v === null || v === undefined || v === '') return fallback;
                const n = Number(v);
                return isFinite(n) ? Number(n.toPrecision(4)) : fallback;
            };
            // 绝对 ppm 色标下的默认阈值就是固定的 420 / 1700；其它量纲
            // （按本场峰值归一化）才退回「量程的 35% / 60%」
            const isPpm = state.displayUnits === 'ppm';
            state.lvl1 = pick(cfg.lvl1, isPpm
                ? DEFAULT_LVL1 : Number((lo + span * 0.35).toPrecision(4)));
            state.lvl2 = pick(cfg.lvl2, isPpm
                ? DEFAULT_LVL2 : Number((lo + span * 0.60).toPrecision(4)));
            $('lvl1Input').value = state.lvl1;
            $('lvl2Input').value = state.lvl2;

            const step = isPpm ? 10 : (span / 100).toPrecision(2);
            $('lvl1Input').step = step;
            $('lvl2Input').step = step;
            state.lvlInit = true;
        }

        function onLevelInput() {
            state.lvl1 = Number($('lvl1Input').value);
            state.lvl2 = Number($('lvl2Input').value);
            state.lvlInit = true;
            applyDanger();
            updateDangerNote();
        }

        function applyDanger() {
            const u = state.uniforms;
            if (!u) return;
            const on = $('dangerChk').checked;
            u.uUseDanger.value = on ? 1 : 0;
            u.uLvl1.value = isFinite(Number(state.lvl1)) ? Number(state.lvl1) : 1e9;
            u.uLvl2.value = isFinite(Number(state.lvl2)) ? Number(state.lvl2) : 1e9;
        }

        function applyToggles() {
            boxGroup.visible = $('boxChk').checked;
            gridGroup.visible = $('boxChk').checked;
            obstGroup.visible = $('obstChk').checked;
            devcGroup.visible = $('devcChk').checked;

            const dark = $('darkChk').checked;
            renderer.setClearColor(dark ? DARK_BG : LIGHT_BG, 1);

            if (state.uniforms) {
                state.uniforms.uOpacity.value = Number($('opacityInput').value);
                // 以最小网格边长做基准，滑块只调相对倍数
                state.uniforms.uStep.value =
                    state.baseStep * Number($('stepInput').value);
            }
            applyDanger();
        }

        // ------------------------------------------------------------------
        // 播放控制
        // ------------------------------------------------------------------
        function onFrameInput() {
            const raw = parseInt($('frameRange').value, 10) || 0;
            // 按档位吸附到格点，最后一帧兜底
            const idx = state.frames.length
                ? Math.min(state.frames.length - 1,
                    Math.round(raw / skipFrames) * skipFrames)
                : raw;
            if (idx !== raw) $('frameRange').value = idx;
            state.index = idx;
            setFrameLabel();
            showFrame(state.index);
        }

        // 拖动档位：一格跨多少模拟时间。帧间距不一定是 5s（由输出间隔决定），
        // 按实测帧间距的中位数把档位换算成帧数。range 的 step 保持 1：
        // 原生大 step 会把滑块吸附到格点，帧数不整除时末尾几帧就拖不到了，
        // 所以改成拖动后在 onFrameInput 里吸附。
        let skipFrames = 1;

        function applySkipGear() {
            if (state.frames.length < 2) { skipFrames = 1; return; }
            const diffs = [];
            for (let i = 1; i < state.frames.length; i++) {
                const a = Number(state.frames[i - 1].time);
                const b = Number(state.frames[i].time);
                if (isFinite(a) && isFinite(b) && b - a > 0) diffs.push(b - a);
            }
            const dt = diffs.length
                ? diffs.sort((x, y) => x - y)[Math.floor(diffs.length / 2)]
                : 0;
            const gear = Number($('skipSelect').value) || 5;
            skipFrames = dt > 0 ? Math.max(1, Math.round(gear / dt)) : 1;
        }

        function togglePlay() {
            if (state.playing) {
                state.playing = false;
                clearInterval(state.timer);
                $('playBtn').textContent = '▶ 播放';
                return;
            }
            if (state.frames.length < 2) return;
            state.playing = true;
            $('playBtn').textContent = '❚❚ 暂停';
            state.timer = setInterval(() => {
                state.index = (state.index + 1) % state.frames.length;
                $('frameRange').value = state.index;
                showFrame(state.index);
            }, 700);
        }

        // ------------------------------------------------------------------
        // 交互绑定
        // ------------------------------------------------------------------
        $('frameRange').addEventListener('input', onFrameInput);
        $('skipSelect').addEventListener('change', applySkipGear);
        $('playBtn').addEventListener('click', togglePlay);
        $('lvl1Input').addEventListener('input', onLevelInput);
        $('lvl2Input').addEventListener('input', onLevelInput);
        $('dangerChk').addEventListener('change', () => {
            applyDanger();
            updateDangerNote();
        });
        $('opacityInput').addEventListener('input', applyToggles);
        $('stepInput').addEventListener('input', applyToggles);
        $('boxChk').addEventListener('change', applyToggles);
        $('obstChk').addEventListener('change', applyToggles);
        $('devcChk').addEventListener('change', applyToggles);
        $('darkChk').addEventListener('change', applyToggles);

        $('templateBtn').addEventListener('click', async () => {
            const box = $('templateBox');
            if (box.style.display === 'block') { box.style.display = 'none'; return; }
            try {
                const r = await fetch(templateApiUrl);
                box.textContent = r.ok ? await r.text() : '（没有读到输入卡）';
            } catch (e) {
                box.textContent = String(e);
            }
            box.style.display = 'block';
        });

        // ------------------------------------------------------------------
        // 渲染循环
        // ------------------------------------------------------------------
        const camLocal = new THREE.Vector3();
        const prevCamPos = new THREE.Vector3();
        const prevCamQuat = new THREE.Quaternion();
        let camFrozen = false;   // 相机已停稳，本帧不再推进
        let interacting = false; // 指针按着 / 触摸中，中途不要冻

        /** 单帧相机位移折算成屏幕像素，用来判断"是不是已经看不见在动了"。 */
        function cameraMotionPixels() {
            const h = renderer.domElement.clientHeight || 1;
            const pxPerRad = h / (2 * Math.tan((camera.fov * Math.PI / 180) / 2));
            const dist = camera.position.distanceTo(controls.target) || 1;
            return (camera.position.distanceTo(prevCamPos) / dist +
                    camera.quaternion.angleTo(prevCamQuat)) * pxPerRad;
        }

        /**
         * 相机就地停死。
         * 阻尼是让相机以越来越小的步长无限逼近目标，松手后画面会长时间
         * 缓慢滑动（尾段速度小但位移还在，看起来就是发飘、一直在闪）。
         * 这里临时关掉阻尼跑一帧，把残余量一次性放完，之后就不再推进相机。
         */
        function freezeCamera() {
            controls.enableDamping = false;
            controls.update();
            controls.enableDamping = true;
            camFrozen = true;
        }

        renderer.domElement.addEventListener('pointerdown', () => {
            interacting = true;
            camFrozen = false;
        });
        window.addEventListener('pointerup', () => { interacting = false; });
        window.addEventListener('pointercancel', () => { interacting = false; });
        // 滚轮缩放没有 pointerdown，靠 controls 自己的 start 事件解冻
        controls.addEventListener('start', () => { camFrozen = false; });

        function animate() {
            requestAnimationFrame(animate);

            if (!camFrozen) {
                controls.update();
                // 单帧位移不到 1/50 像素就没必要再动
                if (!interacting && cameraMotionPixels() < 0.02) freezeCamera();
                prevCamPos.copy(camera.position);
                prevCamQuat.copy(camera.quaternion);
            }

            if (state.mesh && state.uniforms) {
                // 相机位置换算到盒子局部坐标（0 ~ size），供光线求交用
                camLocal.copy(camera.position);
                state.mesh.worldToLocal(camLocal);
                camLocal.addScaledVector(state.uniforms.uBoxSize.value, 0.5);
                state.uniforms.uCameraPos.value.copy(camLocal);
            }
            renderer.render(scene, camera);
        }

        refresh();
        animate();
    </script>
</body>

</html>
